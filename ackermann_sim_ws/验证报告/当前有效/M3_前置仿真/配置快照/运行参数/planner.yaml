/planner_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    GridBased:
      allow_primitive_interpolation: false
      allow_unknown: false
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      analytic_expansion_max_length: 15.0
      analytic_expansion_ratio: 3.5
      angle_quantization_bins: 72
      cache_obstacle_heuristic: true
      change_penalty: 0.0
      cost_penalty: 2.0
      debug_visualizations: false
      downsample_costmap: false
      downsample_obstacle_heuristic: true
      downsampling_factor: 1
      lookup_table_size: 20.0
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      minimum_turning_radius: 2.0813957296344174
      motion_model_for_search: DUBIN
      non_straight_penalty: 1.2
      plugin: nav2_smac_planner::SmacPlannerHybrid
      retrospective_penalty: 0.015
      reverse_penalty: 2.0
      smooth_path: true
      smoother:
        do_refinement: true
        max_iterations: 1000
        refinement_num: 2
        tolerance: 1.0e-10
        w_data: 0.2
        w_smooth: 0.3
      terminal_checking_interval: 5000
      tolerance: 0.15
      use_quadratic_cost_penalty: false
    action_server_result_timeout: 10.0
    autostart_node: false
    bond_heartbeat_period: 0.1
    costmap_update_timeout: 1.0
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    start_type_description_service: true
    use_sim_time: true
