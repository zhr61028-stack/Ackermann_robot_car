/bt_navigator:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    action_server_result_timeout: 900.0
    always_reload_bt_xml: false
    autostart_node: false
    bond_heartbeat_period: 0.1
    bt_loop_duration: 10
    default_cancel_timeout: 20
    default_nav_to_pose_bt_xml: /home/zhanghaoran/.codex/.chatgpt-projects/g-p-6ac0a6b986d08191a18b6f104acd916d/ackermann_sim_ws/install/ackermann_nav/share/ackermann_nav/config/forward_only.xml
    default_server_timeout: 20
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
    global_frame: odom
    goal_blackboard_id: goal
    navigate_to_pose:
      enable_groot_monitoring: false
      groot_server_port: 1667
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    odom_topic: /odom
    path_blackboard_id: path
    plugin_lib_names: []
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
      /tf:
        subscription:
          depth: 100
          durability: volatile
          history: keep_last
          reliability: reliable
      /tf_static:
        subscription:
          depth: 100
          history: keep_last
          reliability: reliable
    robot_base_frame: base_footprint
    start_type_description_service: true
    transform_tolerance: 0.1
    use_sim_time: true
    wait_for_service_timeout: 1000
