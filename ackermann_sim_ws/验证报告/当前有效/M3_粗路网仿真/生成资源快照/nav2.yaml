map_server:
  ros__parameters:
    use_sim_time: true
    frame_id: odom
    topic_name: map
    yaml_filename: /tmp/ackermann_route_fosshfkk/test_map.yaml
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerHybrid
      tolerance: 0.15
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: DUBIN
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 15.0
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
      minimum_turning_radius: 2.0813957296344174
controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    controller_frequency: 40.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.2
      stateful: true
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.4
      lookahead_dist: 1.2
      min_lookahead_dist: 0.8
      max_lookahead_dist: 1.5
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.2
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 1.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 2.2
      regulated_linear_scaling_min_speed: 0.15
      cost_scaling_dist: 0.8
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 2.5
      use_rotate_to_heading: false
      allow_reversing: false
      use_fixed_curvature_lookahead: true
      curvature_lookahead_dist: 1.2
      max_robot_pose_search_dist: 20.0
      interpolate_curvature_after_goal: true
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
    default_nav_to_pose_bt_xml: /home/zhanghaoran/.codex/.chatgpt-projects/Ackermann_robot_car/ackermann_sim_ws/install/ackermann_nav/share/ackermann_nav/config/forward_only.xml
behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - wait
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      resolution: 0.05
      footprint: '[[-0.19000000000000003, -0.3944030650891055], [0.9900000000000001,
        -0.3944030650891055], [0.9900000000000001, 0.3944030650891055], [-0.19000000000000003,
        0.3944030650891055]]'
      footprint_padding: 0.02
      update_frequency: 10.0
      publish_frequency: 2.0
      transform_tolerance: 0.2
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        map_topic: /map
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.5
        inflation_radius: 1.2
      rolling_window: true
      width: 12
      height: 12
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      resolution: 0.05
      footprint: '[[-0.19000000000000003, -0.3944030650891055], [0.9900000000000001,
        -0.3944030650891055], [0.9900000000000001, 0.3944030650891055], [-0.19000000000000003,
        0.3944030650891055]]'
      footprint_padding: 0.02
      update_frequency: 10.0
      publish_frequency: 2.0
      transform_tolerance: 0.2
      track_unknown_space: true
      always_send_full_costmap: true
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        map_topic: /map
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.5
        inflation_radius: 1.2
