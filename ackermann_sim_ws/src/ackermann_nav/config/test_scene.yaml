# 仅用于 M3 前置仿真；全部车辆参数仍来自 vehicle.yaml 的待实测假设。
resolution_m: 0.05
bounds_m: [-5.0, -8.0, 24.0, 12.0]
obstacles:
  - {name: known_box, x: 14.0, y: 3.0, size_x: 1.2, size_y: 2.2, size_z: 1.0}
goals:
  - {name: straight, x: 4.0, y: 0.0, yaw: 0.0}
  - {name: turn, x: 10.0, y: 3.0, yaw: 0.0}
  - {name: known_obstacle, x: 19.0, y: 3.0, yaw: 0.0}
validation:
  endpoint_position_tolerance_m: 0.25
  endpoint_yaw_tolerance_rad: 0.25
  actual_curvature_tolerance_per_m: 0.03
  maximum_goal_duration_s: 120.0
