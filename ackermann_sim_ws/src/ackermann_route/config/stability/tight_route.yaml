route_server:
  ros__parameters:
    DistanceScorer.plugin: nav2_route::DistanceScorer
    ReroutingService.plugin: nav2_route::ReroutingService
    base_frame: base_footprint
    edge_cost_functions:
    - DistanceScorer
    enable_nn_search: false
    graph_file_loader: GeoJsonGraphFileLoader
    graph_file_loader.plugin: nav2_route::GeoJsonGraphFileLoader
    max_planning_time: 2.0
    operations:
    - ReroutingService
    path_density: 0.05
    prune_goal: false
    prune_start: false
    route_frame: odom
    smooth_corners: true
    smoothing_radius: 2.1
    use_sim_time: true
